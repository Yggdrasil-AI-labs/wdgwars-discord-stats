name: ci-quality-gates

# Gated pipeline: test + coverage -> Snyk -> release bundle.
# The package stage only runs if the gates pass. The lightweight ci.yml
# workflow stays as the offline smoke suite; this adds the code-quality and
# security gates on top, matching the rest of the feeder family.
#
# SonarCloud is deliberately NOT a job here. Its GitHub App runs Automatic
# Analysis on every push and PR and posts its own "SonarCloud Code Analysis"
# check, scoped to the changed files. A CI-side scanner conflicts with
# Automatic Analysis (it 403'd on every run this repo ever had), and polling
# the gate API from CI just re-reports the same analysis less accurately,
# against main's whole new-code period instead of the diff. Coverage is
# enforced by the pytest fail_under ratchet in pyproject.toml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Stage 1: run pytest, produce coverage.xml.
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so SonarCloud can attribute new code and blame.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Only the exactly-pinned dev deps: requirements.txt has no runtime
        # entries (stdlib-only tool) and the runner's pip is recent enough.
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest with coverage
        run: pytest --cov=live_stats_channels --cov=discord_stats_webhook --cov-report=xml --cov-report=term-missing --cov-branch
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # Stage 2: Snyk software composition analysis. Only requirements-dev.txt is
  # scanned: the shipped tool is stdlib-only, so requirements.txt is
  # comments-only and Snyk hard-errors on an empty manifest (SNYK-OS-0012)
  # rather than passing. Add a runtime scan step when a real dependency lands.
  snyk:
    name: Snyk dependency scan
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # Secrets are not readable in a job-level `if`, so the token check is a
      # step. Without a token the scan is skipped, not failed.
      - name: Check for a Snyk token
        id: pre
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SNYK_TOKEN is not configured for this repository (no repo secret, and the org has none). Snyk scan skipped; add the secret to enable it."
          fi
      - name: Snyk Open Source scan, dev deps (fail on high or critical)
        if: steps.pre.outputs.has_token == 'true'
        # Pinned to a full SHA (githubactions:S7637); master as of 2026-07-29.
        uses: snyk/actions/python@8e119fbb6c251787721d34ba683ed48eba792766
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=requirements-dev.txt --package-manager=pip --severity-threshold=high

  # Stage 3: build the release bundle. Only if the gates passed, main only.
  package:
    name: Build release artifact
    needs: [snyk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Stage release bundle
        run: |
          mkdir -p dist
          cp live_stats_channels.py discord_stats_webhook.py README.md LICENSE dist/
          cp -r docs dist/docs
          tar -czf wdgwars-discord-stats-bundle.tar.gz -C dist .
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: wdgwars-discord-stats-bundle
          path: wdgwars-discord-stats-bundle.tar.gz
          retention-days: 14
