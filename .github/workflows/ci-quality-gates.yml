name: ci-quality-gates

# Gated pipeline: test + coverage -> release bundle. The lightweight ci.yml
# workflow stays as the offline smoke suite; this adds coverage and the
# release artifact on top.
#
# Two scanners that the other feeders run in CI are deliberately absent here,
# because on this repo each would be a redundant second opinion:
#
# SonarCloud - its GitHub App runs Automatic Analysis on every push and PR and
# posts its own "SonarCloud Code Analysis" check, scoped to the changed files.
# A CI-side scanner conflicts with Automatic Analysis (it 403'd on every run
# this repo ever had), and polling the gate API from CI re-reports the same
# analysis less accurately, against main's whole new-code period instead of
# the diff. Coverage is enforced by the pytest fail_under ratchet instead
# (pyproject.toml), since Automatic Analysis does not ingest coverage.xml.
#
# Snyk - this tool ships stdlib-only, so requirements.txt is comments-only and
# the only declared packages are pytest and pytest-cov. GitHub's own Dependabot
# already watches those and opens version PRs. A Snyk job here needs a
# SNYK_TOKEN this repo does not have and would scan nothing that Dependabot
# misses. Add it back alongside the first real runtime dependency.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Stage 1: run pytest, produce coverage.xml.
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so SonarCloud can attribute new code and blame.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        # Only the exactly-pinned dev deps: requirements.txt has no runtime
        # entries (stdlib-only tool) and the runner's pip is recent enough.
        run: python -m pip install -r requirements-dev.txt
      - name: Run pytest with coverage
        run: pytest --cov=live_stats_channels --cov=discord_stats_webhook --cov-report=xml --cov-report=term-missing --cov-branch
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # Stage 2: build the release bundle. Only if tests passed, main only.
  package:
    name: Build release artifact
    needs: [test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Stage release bundle
        run: |
          mkdir -p dist
          cp live_stats_channels.py discord_stats_webhook.py README.md LICENSE dist/
          cp -r docs dist/docs
          tar -czf wdgwars-discord-stats-bundle.tar.gz -C dist .
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: wdgwars-discord-stats-bundle
          path: wdgwars-discord-stats-bundle.tar.gz
          retention-days: 14
