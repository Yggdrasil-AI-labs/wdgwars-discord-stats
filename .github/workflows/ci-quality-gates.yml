name: ci-quality-gates

# Gated pipeline: test + coverage -> SonarCloud + Snyk -> release bundle.
# The package stage only runs if both gates pass. The lightweight ci.yml
# workflow stays as the offline smoke suite; this adds the code-quality and
# security gates on top, matching the rest of the feeder family.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Stage 1: run pytest, produce coverage.xml.
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so SonarCloud can attribute new code and blame.
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest with coverage
        run: pytest --cov=live_stats_channels --cov=discord_stats_webhook --cov-report=xml --cov-report=term-missing --cov-branch
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # Stage 2a: SonarCloud quality gate. Analysis itself is done by SonarCloud's
  # Automatic Analysis (the GitHub app), which analyzes every push and PR with
  # no token; this job polls the public API for the resulting quality gate and
  # fails when the gate does. The previous in-CI scanner conflicted with
  # Automatic Analysis and 403'd on every run this repo ever had. Trade-off:
  # Automatic Analysis does not ingest coverage.xml, so coverage lives in the
  # pytest fail_under ratchet (pyproject.toml), not on SonarCloud.
  sonarcloud:
    name: SonarCloud quality gate
    needs: test
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Wait for Automatic Analysis and check the quality gate
        run: |
          key="Yggdrasil-AI-labs_wdgwars-discord-stats"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scope="pullRequest=${{ github.event.pull_request.number }}"
          else
            scope="branch=main"
          fi
          for i in $(seq 1 10); do
            status=$(curl -sf "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${key}&${scope}" | jq -r '.projectStatus.status')
            echo "attempt ${i}: quality gate = ${status}"
            case "$status" in
              OK) exit 0 ;;
              ERROR)
                echo "::error::SonarCloud quality gate is failing: https://sonarcloud.io/project/overview?id=${key}"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::quality gate status unavailable after 10 attempts (Automatic Analysis may not have finished or may be disabled)"
          exit 1

  # Stage 2b: Snyk software composition analysis. The tool is stdlib-only:
  # requirements.txt is comments-only, and Snyk hard-errors on an empty
  # manifest (SNYK-OS-0012) instead of passing, so the runtime scan only
  # runs once requirements.txt gains a real entry. The dev manifest has
  # real dependencies (pytest and friends) and is scanned on every run.
  snyk:
    name: Snyk dependency scan
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check preconditions (token, runtime manifest)
        id: pre
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -n "$SNYK_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SNYK_TOKEN is not configured for this repository (no repo secret, and the org has none). Snyk scan skipped; add the secret to enable it."
          fi
          if grep -vE '^\s*(#|$)' requirements.txt > /dev/null; then
            echo "has_runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_runtime=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Snyk Open Source scan, dev deps (fail on high or critical)
        if: steps.pre.outputs.has_token == 'true'
        # Pinned to a full SHA (githubactions:S7637); master as of 2026-07-29.
        uses: snyk/actions/python@8e119fbb6c251787721d34ba683ed48eba792766
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=requirements-dev.txt --package-manager=pip --severity-threshold=high
      - name: Snyk Open Source scan, runtime deps (fail on high or critical)
        if: steps.pre.outputs.has_token == 'true' && steps.pre.outputs.has_runtime == 'true'
        # Pinned to a full SHA (githubactions:S7637); master as of 2026-07-29.
        uses: snyk/actions/python@8e119fbb6c251787721d34ba683ed48eba792766
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=requirements.txt --package-manager=pip --severity-threshold=high
      - name: Snyk monitor (track shipped deps for new CVEs)
        if: github.ref == 'refs/heads/main' && steps.pre.outputs.has_token == 'true' && steps.pre.outputs.has_runtime == 'true'
        continue-on-error: true
        # Pinned to a full SHA (githubactions:S7637); master as of 2026-07-29.
        uses: snyk/actions/python@8e119fbb6c251787721d34ba683ed48eba792766
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --file=requirements.txt --package-manager=pip

  # Stage 3: build the release bundle. Only if both gates passed, main only.
  package:
    name: Build release artifact
    needs: [sonarcloud, snyk]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Stage release bundle
        run: |
          mkdir -p dist
          cp live_stats_channels.py discord_stats_webhook.py README.md LICENSE dist/
          cp -r docs dist/docs
          tar -czf wdgwars-discord-stats-bundle.tar.gz -C dist .
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: wdgwars-discord-stats-bundle
          path: wdgwars-discord-stats-bundle.tar.gz
          retention-days: 14
