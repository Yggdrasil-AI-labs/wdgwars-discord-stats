<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="wdgwars-discord-stats - your live WDGWars numbers in your Discord sidebar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1f22"/>
      <stop offset="1" stop-color="#2b2d31"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8b477"/>
      <stop offset="1" stop-color="#b08850"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SFMono-Regular','Consolas','Liberation Mono',monospace; }
      .sans { font-family: 'Segoe UI',Helvetica,Arial,sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="6" fill="url(#gold)"/>

  <!-- left: title block -->
  <text x="64" y="96" class="sans" font-size="18" letter-spacing="6" fill="#b08850" font-weight="600">WDGoWARS  ×  DISCORD</text>
  <text x="62" y="168" class="mono" font-size="54" fill="#ffffff" font-weight="700">wdgwars-discord-stats</text>
  <rect x="64" y="192" width="132" height="5" rx="2.5" fill="url(#gold)"/>
  <text x="64" y="238" class="sans" font-size="23" fill="#c7c9ce">Your live WDGWars numbers, right in your Discord sidebar.</text>
  <text x="64" y="278" class="sans" font-size="18" fill="#8a8d93">Voice-channel dashboard · webhook poster · full API reference · zero dependencies</text>

  <!-- right: mock "live stats" category card -->
  <g transform="translate(792,58)">
    <rect x="0" y="0" width="344" height="224" rx="14" fill="#111214" stroke="#3a3c41" stroke-width="1"/>
    <text x="20" y="34" class="sans" font-size="15" letter-spacing="2" fill="#b08850" font-weight="700">📊 │ LIVE STATS</text>
    <line x1="20" y1="48" x2="324" y2="48" stroke="#2b2d31" stroke-width="1"/>

    <g class="sans" font-size="17" fill="#b5b8bd">
      <text x="20" y="80">🔊  📊 Total: 145 000</text>
      <text x="20" y="112">🔊  📶 WiFi: 96 350</text>
      <text x="20" y="144">🔊  🔵 BLE: 42 100</text>
      <text x="20" y="176">🔊  ✈ ADS-B: 5 120</text>
      <text x="20" y="208">🔊  🟢 API: UP (72ms)</text>
    </g>
  </g>
</svg>
