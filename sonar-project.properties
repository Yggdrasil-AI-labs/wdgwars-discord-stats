# SonarCloud (SonarQube Cloud) configuration for wdgwars-discord-stats.
#
# Setup once, then the Sonar workflow (.github/workflows/sonar.yml) uses it:
#   1. Sign in to https://sonarcloud.io (EU region) with the GitHub account
#      and import this repo. SonarQube Cloud is free for public repositories.
#   2. Confirm the organization + project keys below match what SonarCloud
#      assigns (the defaults are its usual GitHub-import convention).
#   3. In project settings, disable "Automatic Analysis" so the CI scanner is
#      the source of truth.
#   4. Add the SONAR_TOKEN Actions secret (org-level is fine), then run the
#      Sonar workflow from the Actions tab (workflow_dispatch).

sonar.organization=yggdrasil-ai-labs
sonar.projectKey=Yggdrasil-AI-labs_wdgwars-discord-stats
sonar.projectName=wdgwars-discord-stats

# The two scripts are the whole application.
sonar.sources=live_stats_channels.py,discord_stats_webhook.py

# Python versions the code targets (matches the CI matrix).
sonar.python.version=3.9,3.12

# Keep the banner, docs, and shipped examples out of analysis.
sonar.exclusions=assets/**,examples/**,docs/**

# Block on the quality gate: the scan step fails the job if the gate fails.
sonar.qualitygate.wait=true
