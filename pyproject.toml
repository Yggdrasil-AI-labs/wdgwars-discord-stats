[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
branch = true
source = ["live_stats_channels", "discord_stats_webhook", "war_feed"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Regression floor, set just below the measured baseline. The build fails if
# coverage drops below this. It is a ratchet, not a target: raise it as tests
# are added. The real enforcement is the SonarCloud Clean-as-You-Code gate on
# new code (see sonar-project.properties).
fail_under = 25
